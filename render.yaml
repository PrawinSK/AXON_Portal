services:
  - type: web
    name: axon-ui
    env: python
    buildCommand: "pip install -r axon.ai/requirements.txt && cd axon-ui && npm install && npm run build"
    startCommand: "cd axon.ai && python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.13
